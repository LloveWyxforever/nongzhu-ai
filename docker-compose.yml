# 农助 AI —— 自建云主机编排（前端 + 后端 + 持久卷）
# 仅本地/单机部署用途；本文件不发布、不开公网隧道。上云由你在装有 Docker 的主机上执行。
#
# 首次运行前置条件：
#   1) 在项目根 .env 填好 DEEPSEEK_API_KEY 等（本编排通过 env_file 注入，密钥不进镜像）。
#   2) 在 deploy/certs/ 放置 TLS 证书：fullchain.pem + privkey.pem（Let's Encrypt 或自签）。
#      缺失时 web 容器会在 `nginx -t` 报错退出——这是预期保护，避免无证书半启动。

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nongzhu-backend:latest
    container_name: nongzhu-backend
    # 复用项目根 .env（你本机已管理密钥）；也可改为 deploy/.env.docker
    env_file:
      - .env
    environment:
      NONGZHU_DB: /app/data/nongzhu.db
    volumes:
      - nongzhu-data:/app/data           # SQLite(nongzhu.db) + uploads + media 持久化
      - nongzhu-knowledge:/app/knowledge # 导入的知识原文 + FTS5 语料所在盘
    expose:
      - "8017"                            # 仅容器网络内可达，不对宿主机/公网直接暴露
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8017/api/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: nongzhu-web:latest
    container_name: nongzhu-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro       # TLS 证书
      - ./deploy/certbot:/var/www/certbot:ro     # ACME http-01 续期挑战目录
    restart: unless-stopped

volumes:
  nongzhu-data:
  nongzhu-knowledge:
