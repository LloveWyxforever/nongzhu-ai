# 农助 AI —— Nginx 反向代理（自建云主机）
# 覆盖用户要求：TLS/HTTPS、SSE 关闭缓冲、client_max_body_size、同源 /api 代理、大 body 上传、视频 Range。
# TLS 选项已内联，不依赖 certbot 生成的 /etc/letsencrypt/*；只要 deploy/certs 下有证书即可启动。
# 备用方案：deploy/nginx/options-ssl-nginx.conf.example 提供等价的推荐选项片段，按需替换。

# Docker 内嵌 DNS，配合变量 proxy_pass 延迟解析后端名（解决启动顺序/依赖问题）
resolver 127.0.0.11 valid=30s ipv6=off;

# ---- 80：ACME 续期 + 其余跳转 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：HTTPS 主站 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # 内联推荐 TLS 选项（不 include 外部文件），仅需证书文件存在
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 图片上限 8MB / 视频上限 30MB（见 main.py），留出 multipart 封装余量
    client_max_body_size 40m;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- API：JSON + SSE(/api/chat) + 上传(/api/uploads、/api/knowledge) + 媒体(/api/media/*) ----
    location /api/ {
        set $upstream_backend http://backend:8017;
        proxy_pass $upstream_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关闭缓冲与缓存、清掉 Connection 复用 keepalive，保证逐 token 流式抵达
        proxy_buffering    off;
        proxy_cache        off;
        proxy_request_buffering off;
        proxy_set_header   Connection "";
        add_header         X-Accel-Buffering no;

        # 上传大包与流式长连接：延长读/写/发送超时
        proxy_connect_timeout 60s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
        send_timeout          1h;

        # 视频 FileResponse 需要 Range → 206 分段
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache 1;
    }

    # ---- 静态资源：长期缓存（Vite 产物带内容 hash）----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA：hash 路由为主，提供 index.html 兜底 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
